  # 후보 image 안의 Dagster package migration graph를 그대로 실행·검증하는 유일한
  # metadata storage writer다. application Alembic과 source SHA는 전혀 읽지 않는다.
  dagster-storage-migrate:
    build:
      context: .
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
      secrets:
        - github_token
    command: ["/usr/local/bin/ktm-dagster-storage", "migrate"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PROFILE: ${KOR_TRAVEL_MAP_DAGSTER_PROFILE:-${KOR_TRAVEL_MAP_API_PROFILE:-production}}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
