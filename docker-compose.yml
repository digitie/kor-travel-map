      KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256:-}
    volumes:
      - kor-travel-map-dagster-storage-permit:/run/kor-travel-map-dagster-storage-permit:ro
    # external DB/infra overlay가 host.docker.internal DSN을 주입하므로 one-shot도
    # 장기 Dagster service와 같은 host gateway mapping을 가져야 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  kor-travel-map-postgres:
  kor-travel-map-mois-source:
    name: ${KOR_TRAVEL_MAP_MOIS_SOURCE_DB_VOLUME:-kor-travel-map-mois-source}
  kor-travel-map-rustfs-data:
    name: ${KOR_TRAVEL_MAP_RUSTFS_VOLUME:-kor-travel-map-rustfs}
  kor-travel-map-application-final-permit:
    name: ${KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_VOLUME:-kor-travel-map-application-final-permit}
  kor-travel-map-dagster-storage-permit:
    name: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_VOLUME:-kor-travel-map-dagster-storage-permit}

# bridge 모드에서 API가 신뢰할 frontend BFF peer를 정확한 /32로 고정한다.
# 다른 서비스는 이 control-plane network에 참여하지 않는다.
networks:
  admin-control:
    ipam:
      config:
        - subnet: 172.31.254.0/29

# private provider repo fetch용 (#370). 미설정(빈 값) 시 public pin만 fetch.
secrets:
  github_token:
    environment: GITHUB_TOKEN
