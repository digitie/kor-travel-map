# 외부(공유) DB 모드 오버레이.
#
# 붙을 대상은 `kor-travel-docker-manager`가 띄우는 **map 전용** PostgreSQL,
# `kor-travel-map-postgres`(host **12700**, loopback 전용)다.
#
# ⚠️ `5432`도 `kor-travel-geo-postgres`도 아니다. 2026-08-17(docker-manager ADR-37)에
#    PostgreSQL이 프로젝트별 전용 instance로 나뉘었다 — geo는 `12500`의 geo 전용이고
#    `5432`를 듣는 것은 없다. 옛 문서를 보고 5432로 붙으면 연결 자체가 실패한다.
#
# 포트를 정하는 별도 변수는 없다. 이 overlay는 포트를 조합하지 않고 아래
# `..._PG_DSN`을 그대로 주입하므로 포트는 각 DSN 문자열 안에 있다.
#
# 이 overlay는 Manager-owned production composition의 내부 입력이다. standalone
# `scripts/docker-up.sh`는 application/metadata permit producer가 없으므로 이 모드를
# 명시적으로 거부한다. 운영자는 Docker Manager controlled transaction만 사용한다.
#
# 공유 DB에는 `kor_travel_map`과 `kor_travel_map_dagster` DB가 있어야 한다.
# API/Dagster runtime·migrator·Dagster metadata DSN은 모두 ignored deployment env/vault로
# 명시한다. bootstrap password 또는 DSN의 tracked 기본값은 없다.
services:
  postgres:
    profiles: ["local-infra"]

  dagster-db-init:
    profiles: ["local-infra"]

  dagster-db-init-fresh-300:
    profiles: ["local-infra"]

  db-application-create-fresh-300:
    profiles: ["local-infra"]

  # 공유 DB에서는 ownership transfer bootstrap을 절대 자동 실행하지 않는다.
  # 역할은 dedicated map DB에 대해 운영자가 사전 provision해야 한다.
  db-role-bootstrap-300:
    profiles: ["local-infra"]

  api:
    depends_on: !override
      rustfs-init:
        condition: service_completed_successfully
    environment:

  dagster-storage-migrate:
    depends_on: !override {}
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:-}

  dagster:
    depends_on: !override
      rustfs-init:
        condition: service_completed_successfully
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:-}

  dagster-daemon:
    depends_on: !override
      rustfs-init:
        condition: service_completed_successfully
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:-}
