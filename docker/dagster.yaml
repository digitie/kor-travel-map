telemetry:
  enabled: false

# provider_fetchers의 표준 logging 경고(H45 재시도/예산 소진)를 Dagster event
# stream에도 결선한다. WARNING 이상만 수집해 정상 record 로그 노이즈는 피한다.
python_logs:
  managed_python_loggers:
    - kortravelmap.dagster.provider_fetchers
  python_log_level: WARNING

# **로컬 쓰기는 전부 `/opt/dagster/state`로 간다.** `DAGSTER_HOME`은 설정 전용이고
# root 소유 읽기 전용이다(`dagster.Dockerfile`: `chown -R root:root /opt/dagster` 뒤
# `chown appuser:appuser /opt/dagster/state`). 그런데 이 둘을 선언하지 않으면 Dagster는
# 기본값으로 `$DAGSTER_HOME/storage`를 쓰려 하고, uid 999는 그 자리를 만들 수 없다 —
# run이 `PermissionError: '/opt/dagster/dagster_home/storage'`로 죽는다(2026-09-11 실측:
# 이 prod에서 성공한 run이 하나도 없었다).
#
# run/event/schedule storage는 아래 postgres가 갖는다. 여기 두 항목은 그것이 덮지 않는
# 나머지다 — compute log와 IO manager의 로컬 artifact다.
local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/state/artifacts

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/state/compute_logs

storage:
  postgres:
    postgres_url:
      env: KOR_TRAVEL_MAP_DAGSTER_PG_URL
    # runtime process가 누락 table을 암묵 생성해 불완전한 one-shot을 숨기지 못하게 한다.
    # fresh 생성과 schema/data migration은 ktm-dagster-storage만 수행한다.
    should_autocreate_tables: false

# pool을 선언한 provider asset은 instance 전역에서 동시에 1개 run만 실행한다.
# OpiNet place/price는 ``opinet_api``, KREX notice는 ``krex_notice_snapshot`` pool을
# 사용한다. 전자는 key 동시 소비를, 후자는 10분 cron보다 오래 걸린 snapshot의
# load/reconcile 순서 역전을 막는다.
concurrency:
  pools:
    default_limit: 1
    granularity: run
  # **동시 실행 상한을 암묵 기본값에 맡기지 않는다.**
  #
  # 이 값을 선언하지 않아도 Dagster는 `QueuedRunCoordinator`로 큐를 돌린다 —
  # `InstanceRef.from_dir`의 기본값이다. 즉 큐는 이미 우리를 지배하고 있었고 그 상한만
  # 우리가 모르고 있었다. 2026-09-12 prod 실측: `_max_concurrent_runs = 10`인데
  # `_inst_data.config_yaml`이 `{}`다 — 값은 10인데 **아무도 그것을 고른 적이 없다.**
  #
  # 형제 저장소 `kor-travel-weather`가 이 정확한 자리에서 두 번 멈췄다. 프로세스가
  # 사라진 run이 `STARTED`로 남아 슬롯을 영구 점유하고, 컨테이너 교체가 쌓이면 상한이
  # "돌지 않는 run"으로 가득 차 daemon이 "10 runs are currently in progress. Maximum is
  # 10, won't launch more"만 적는다. 두 번째에는 시간별 수집이 **18시간** 멈췄다.
  #
  # 그 정지의 치료는 `run_monitoring`이고 Map은 이미 갖고 있다(전역 6시간 상한 +
  # schedule별 `dagster/max_runtime` tag). 여기서 더하는 것은 **상한 자체를 정본으로
  # 만드는 것**이다 — 값은 바꾸지 않는다(실측 유효값과 같은 10). Dagster 업그레이드가
  # 기본값을 움직여도 이 파일이 정본이고, 상한을 바꾸려면 이 주석을 읽게 된다.
  #
  # provider job은 rate-limited 공개 API에 대한 IO-bound 작업이고 n150은 단일 회전
  # 디스크를 weather/concierge/geo/airport와 공유한다. 올려도 수집이 빨라지지 않는다.
  #
  # `run_coordinator`에 두면 안 된다 — `pools`가 선언된 상태에서 그 둘은 상호
  # 배타이고 Dagster가 `DagsterInvalidConfigError`로 거부한다(1차 시안이 그랬다).
  runs:
    max_concurrent_runs: 10

# **tick 이력에 상한을 준다.**
#
# 2026-09-12 실측에서 `job_ticks`가 이미 metadata DB의 **가장 큰 표**였다
# (2,504 kB / 1,508행, 스택이 올라온 뒤 두 시간 만에). 분 단위 schedule이 하나
# 돌고 있으므로 하루 ~1,440행씩 늘어난다. weather는 같은 host에서 디스크를 한 번
# 소진한 뒤 이 설정을 넣었다.
#
# **이것이 덮지 않는 것**: `retention`은 schedule/sensor **tick**만 지운다. `runs`와
# `event_logs`는 그대로 늘어난다. 지금 prod에서 그것이 터지지 않는 이유는 파괴적
# rebuild가 배포마다 metadata DB를 비우기 때문이고, 그것은 보증이 아니다 — run 이력
# 자체의 상한은 별도 과제다.
retention:
  schedule:
    purge_after_days: 14
  sensor:
    purge_after_days: 14

# 컨테이너 재시작으로 worker process만 사라지고 metadata가 STARTED/STARTING에
# 남으면 queued-run 동시성 슬롯을 영구 점유한다. MOIS처럼 정상적으로 2시간을 넘는
# bulk run을 보호하도록 전역 상한은 6시간으로 두고, 최신성 provider는 job별 2시간
# ``dagster/max_runtime`` tag로 더 일찍 회수한다.
run_monitoring:
  enabled: true
  start_timeout_seconds: 600
  cancel_timeout_seconds: 600
  max_runtime_seconds: 21600
  max_resume_run_attempts: 0
  poll_interval_seconds: 15
