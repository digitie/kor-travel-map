      KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID: ${KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID:-}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: "true"
      KOR_TRAVEL_MAP_DAGSTER_SCHEDULE_OVERRIDES_REQUIRED: "true"
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://rustfs:9000}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KOR_TRAVEL_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      KOR_TRAVEL_MAP_OBJECT_STORE_PREFIX: ${KOR_TRAVEL_MAP_OBJECT_STORE_PREFIX:-features}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX:-offline-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY:-${DATA_GO_KR_SERVICE_KEY:-${DATAGOKR_API_KEY:-${PUBLIC_DATA_SERVICE_KEY:-${SERVICE_KEY:-}}}}}
      KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH: ${KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH:-/app/data/mois/mois.db}
      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-${OPINET_API_KEY:-${OPINET_SERVICE_KEY:-}}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-disabled}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_KREX_EX_API_KEY: ${KOR_TRAVEL_MAP_KREX_EX_API_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}
      KOR_TRAVEL_MAP_KREX_GO_API_KEY: ${KOR_TRAVEL_MAP_KREX_GO_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}}
      # VWorld 키로 떨어지지 않는다 — 그건 kor-travel-geo가 **상류 VWorld로 나갈 때**
      # 쓰는 키이지 map이 geo에 인증할 소비자 키가 아니다. geo는 그 값을 401(E0401)로
      # 거절하는데, `preflight()`는 존재·길이만 보므로 리소스 초기화는 통과하고 첫
      # 요청에서야 터진다. 2026-08-13 prod에서 정확히 그렇게 dagster/daemon이 죽은 키를
      # 들고 있었다(T-VN-H46B). 비어 있으면 비어 있는 채로 두고 fail-closed 한다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL:-http://host.docker.internal:12501}
