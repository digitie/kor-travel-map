name: PostGIS integration (manual)

run-name: PostGIS-only @ ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: pytest integration (PostGIS-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/kor-travel-map-api/pyproject.toml
            packages/kor-travel-map-dagster/pyproject.toml

      - name: Install main package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install REST API package
        run: python -m pip install -e packages/kor-travel-map-api

      - name: Install Dagster package
        run: python -m pip install -e packages/kor-travel-map-dagster

      - name: Run PostGIS integration tests
        run: pytest tests/integration -q --no-cov
