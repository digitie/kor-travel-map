telemetry:
  enabled: false

# provider_fetchers의 표준 logging 경고(H45 재시도/예산 소진)를 Dagster event
# stream에도 결선한다. WARNING 이상만 수집해 정상 record 로그 노이즈는 피한다.
python_logs:
  managed_python_loggers:
    - kortravelmap.dagster.provider_fetchers
  python_log_level: WARNING

# **로컬 쓰기는 전부 `/opt/dagster/state`로 간다.** `DAGSTER_HOME`은 설정 전용이고
# root 소유 읽기 전용이다(`dagster.Dockerfile`: `chown -R root:root /opt/dagster` 뒤
# `chown appuser:appuser /opt/dagster/state`). 그런데 이 둘을 선언하지 않으면 Dagster는
# 기본값으로 `$DAGSTER_HOME/storage`를 쓰려 하고, uid 999는 그 자리를 만들 수 없다 —
# run이 `PermissionError: '/opt/dagster/dagster_home/storage'`로 죽는다(2026-09-11 실측:
# 이 prod에서 성공한 run이 하나도 없었다).
#
# run/event/schedule storage는 아래 postgres가 갖는다. 여기 두 항목은 그것이 덮지 않는
# 나머지다 — compute log와 IO manager의 로컬 artifact다.
local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /opt/dagster/state/artifacts

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /opt/dagster/state/compute_logs

storage:
  postgres:
    postgres_url:
      env: KOR_TRAVEL_MAP_DAGSTER_PG_URL
    # runtime process가 누락 table을 암묵 생성해 불완전한 one-shot을 숨기지 못하게 한다.
    # fresh 생성과 schema/data migration은 ktm-dagster-storage만 수행한다.
    should_autocreate_tables: false

# pool을 선언한 provider asset은 instance 전역에서 동시에 1개 run만 실행한다.
# OpiNet place/price는 ``opinet_api``, KREX notice는 ``krex_notice_snapshot`` pool을
# 사용한다. 전자는 key 동시 소비를, 후자는 10분 cron보다 오래 걸린 snapshot의
# load/reconcile 순서 역전을 막는다.
concurrency:
  pools:
    default_limit: 1
    granularity: run
  # **동시 실행 상한을 암묵 기본값에 맡기지 않는다.**
  #
  # 이 값을 선언하지 않아도 Dagster는 `QueuedRunCoordinator`로 큐를 돌린다 —
  # `InstanceRef.from_dir`의 기본값이다. 즉 큐는 이미 우리를 지배하고 있었고 그 상한만
  # 우리가 모르고 있었다. 2026-09-12 prod 실측: `_max_concurrent_runs = 10`인데
  # `_inst_data.config_yaml`이 `{}`다 — 값은 10인데 **아무도 그것을 고른 적이 없다.**
  #
  # 형제 저장소 `kor-travel-weather`가 이 정확한 자리에서 두 번 멈췄다. 프로세스가
  # 사라진 run이 `STARTED`로 남아 슬롯을 영구 점유하고, 컨테이너 교체가 쌓이면 상한이
  # "돌지 않는 run"으로 가득 차 daemon이 "10 runs are currently in progress. Maximum is
  # 10, won't launch more"만 적는다. 두 번째에는 시간별 수집이 **18시간** 멈췄다.
  #
  # 그 정지의 치료는 `run_monitoring`이고 Map은 이미 갖고 있다(전역 6시간 상한 +
  # schedule별 `dagster/max_runtime` tag). 여기서 더하는 것은 **상한 자체를 정본으로
  # 만드는 것**이다 — 값은 바꾸지 않는다(실측 유효값과 같은 10). Dagster 업그레이드가
  # 기본값을 움직여도 이 파일이 정본이고, 상한을 바꾸려면 이 주석을 읽게 된다.
  #
  # provider job은 rate-limited 공개 API에 대한 IO-bound 작업이고 n150은 단일 회전
  # 디스크를 weather/concierge/geo/airport와 공유한다. 올려도 수집이 빨라지지 않는다.
  #
  # `run_coordinator`에 두면 안 된다 — `pools`가 선언된 상태에서 그 둘은 상호
  # 배타이고 Dagster가 `DagsterInvalidConfigError`로 거부한다(1차 시안이 그랬다).
  runs:
    max_concurrent_runs: 10
    # **한 job class가 큐를 전부 먹지 못하게 한다.**
    #
    # `feature_update_request_queue_sensor`는 15초마다 tick하고 tick당 RunRequest를
    # 최대 10개 낸다 — 그 수가 위 상한과 **같다**. request마다 run_key가 다르므로
    # 10개가 전부 별개 run으로 뜬다. 그리고 `feature_update_request_worker` job에는
    # `dagster/max_runtime` tag가 없어 각 run이 전역 6시간을 쓸 수 있다.
    #
    # 그 run이 붙잡는 것은 슬롯만이 아니다. 멈춘 upstream 호출은
    # `async with session.begin():` 안에 있어 request/scope advisory lock 2개와 열린
    # 트랜잭션·전용 connection이 run 수명 내내 유지된다. 그동안 같은 scope를 노리는
    # 다른 request는 `FeatureUpdateLockBusy`로 requeue되는데 generation이 +1돼
    # run_key가 바뀌므로 sensor가 15초마다 **새 run을 또 만든다.**
    #
    # 슬롯이 만석이면 daemon은 priority sort **이전에** `return []`한다
    # (`queued_run_coordinator_daemon.py`). 즉 만석 구간에서 우선순위는 아무것도
    # 바꾸지 않는다 — 배분은 여기서 강제해야 한다.
    #
    # `value`를 주지 않는다. value 없는 항목은 그 key를 가진 in-progress run
    # **전체**를 센다(`dagster/_utils/tags.py`) — request id는 매번 다르므로
    # key만으로 묶어야 worker class 전체가 4로 묶인다.
    #
    # 4는 "과반을 남긴다"에서 왔다. 10 중 4를 worker에 주면 정기 적재 provider
    # job에 6이 남는다. 교환은 명시적이다 — 요청 5건 이상이 동시에 들어오면 4건만
    # 실행되고 나머지는 QUEUED로 남는다(버려지지 않는다). 장기 정지의 비용이
    # "최신성 job 굶주림"에서 "관리자 요청 대기열"로 옮겨가는 것이 의도다.
    tag_concurrency_limits:
      - key: "kor_travel_map.feature_update_request_id"
        limit: 4

# **상한이 없던 tick에만 상한을 준다.**
#
# 처음에는 양쪽에 `purge_after_days: 14`를 주었다. 그것이 **틀렸다.** Dagster의
# 기본값이 두 축에서 반대 부호이기 때문이다(`get_default_tick_retention_settings`):
#
#   schedule : STARTED/SKIPPED/SUCCESS/FAILURE 전부 -1 (영구 보존)
#   sensor   : SKIPPED 7일, 나머지 -1
#
# 그리고 bare int는 **네 status 전부**에 적용된다. 즉 sensor에 14를 주는 것은 이미
# 7일로 지워지고 있던 것을 14일로 **늘리는** 일이다. 2026-09-12 prod 실측으로
# 그것이 무엇을 뜻하는지가 분명해졌다:
#
#   SENSOR   / SKIPPED   18.40 행/분  ≈ 26,500/일   ← 전체 tick의 93%
#   SCHEDULE / 전체       ~1.0 행/분  ≈  1,440/일
#
# sensor SKIPPED를 7 → 14로 올리면 정상상태가 ~185k → ~371k행이 된다. schedule 쪽에
# 새로 생긴 상한이 그 +186k를 상쇄하려면 연속 가동 ~129일이 필요한데, 파괴적
# rebuild 주기는 그보다 훨씬 짧다 — **모든 현실적 구간에서 표를 키운다.**
#
# 그래서 여기서 배운 것을 먼저 적는다. **`job_ticks`가 가장 큰 표인 것은 retention
# 구멍이 아니었다.** 지배 성분에는 이미 상한이 있었고, 크기의 원인은 sensor 10개가
# 15~30초마다 tick하며 대부분 skip하는 **비율**이다. 그 비율을 줄이는 것(sensor
# 간격·개수)은 이 파일이 아니라 정의 쪽 문제이고 별도 과제다.
#
# 이 블록이 실제로 닫는 것은 **상한이 아예 없던 것들**이다 — schedule의 네 status
# 전부와 sensor의 SKIPPED 아닌 세 status. sensor SKIPPED는 기본값 7을 **명시적으로
# 그대로** 둔다: 값을 바꾸지 않지만, 다음 사람이 bare int로 덮어써 같은 실수를
# 반복하지 않도록 자리를 차지해 둔다.
#
# **이것이 덮지 않는 것 둘.**
#
# 1. `runs`와 `event_logs`. `retention`은 tick만 지운다.
# 2. **끈 schedule/sensor의 tick.** purge는 tick context가 닫힐 때 그 instigator의
#    `selector_id`로 범위가 좁혀진 DELETE라, 더 이상 tick하지 않는 instigator의
#    과거 행은 며칠이 지나도 지워지지 않는다. `schedules.py`의
#    `DISABLED_FEATURE_LOAD_SCHEDULES`가 2026-09-09에 제거한 6개 schedule의 이력이
#    그 상태다. 그 잔존분을 실제로 비우는 것은 (1)과 같은 자리의 별도 과제다.
retention:
  schedule:
    # 기본값 -1(영구) → 14. 여기가 실재하던 구멍이다.
    purge_after_days: 14
  sensor:
    # status별로 내린다. bare int를 쓰면 SKIPPED까지 함께 움직여 지배 성분을
    # 키운다 — 위 실측이 그것이다.
    purge_after_days:
      # 기본값 그대로. 바꾸지 않는다는 것을 명시하려고 적는다.
      skipped: 7
      # 아래 셋은 기본값이 -1(영구)이었다. 여기가 닫는 구멍이다.
      success: 14
      started: 14
      # 실패는 더 오래 본다. 사후 판독의 유일한 근거이고 양이 적다
      # (SENSOR/FAILURE 실측 34행 / 2h37m).
      failure: 30

# 컨테이너 재시작으로 worker process만 사라지고 metadata가 STARTED/STARTING에
# 남으면 queued-run 동시성 슬롯을 영구 점유한다. MOIS처럼 정상적으로 2시간을 넘는
# bulk run을 보호하도록 전역 상한은 6시간으로 두고, 최신성 provider는 job별 2시간
# ``dagster/max_runtime`` tag로 더 일찍 회수한다.
run_monitoring:
  enabled: true
  start_timeout_seconds: 600
  cancel_timeout_seconds: 600
  max_runtime_seconds: 21600
  max_resume_run_attempts: 0
  poll_interval_seconds: 15
