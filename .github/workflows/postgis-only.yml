name: PostGIS integration (manual)

run-name: PostGIS-only @ ${{ github.ref_name }} by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    # `ci.yml`의 `integration`과 같은 lane이다(ADR-118). 다른 이미지에서 다시 확인하면
    # prod major가 빨개도 초록으로 보인다. digest의 정본은
    # `tests/integration/_postgis_image.py`이고 `tests/unit/test_ci_workflows.py`가 대조한다.
    name: pytest integration (PostGIS-only, ${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: pg18
            image: postgis/postgis@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    env:
      KTM_TEST_POSTGIS_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            docker/constraints-dagster.txt
            packages/kor-travel-map-api/pyproject.toml
            packages/kor-travel-map-dagster/pyproject.toml

      - name: Install main package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c docker/constraints-dagster.txt -e ".[dev]"

      - name: Install REST API package
        run: python -m pip install -c docker/constraints-dagster.txt -e packages/kor-travel-map-api

      - name: Install Dagster package
        run: python -m pip install -c docker/constraints-dagster.txt -e packages/kor-travel-map-dagster

      - name: Run PostGIS integration tests
        run: pytest tests/integration -q --no-cov
