services:
  postgres:
    image: postgis/postgis@sha256:dc17b064a946f64804d3b15e2ce90d01a444c02c9226a28a54764c083bd81a0c
    # T-102 — pg_prewarm autoprewarm background worker(부팅 후 buffer warm-up). 확장 자체는
    # alembic 0022가 만들고, autoprewarm(주기 dump + 재기동 reload)은 아래 server config로 켠다.
    # 저비용이라 standalone 스택 기본 on. 효과는 shared_buffers가 hot 데이터에 fit할 때 큼
    # (docs/performance.md §9.5). 끄려면 command override 제거.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_prewarm"
      - "-c"
      - "pg_prewarm.autoprewarm=on"
    environment:
      # PostGIS image는 POSTGRES_DB에 extension/schema를 자동 설치한다. application DB는
      # virgin `300` preflight가 받을 수 있도록 maintenance DB 초기화 뒤 template0에서
      # 별도 fresh one-shot이 만든다.
      POSTGRES_DB: postgres
      POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      POSTGRES_PASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:-kor_travel_map_dagster}
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - kor-travel-map-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test \"$$(cat /proc/1/comm)\" = postgres && pg_isready -U ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map} -d postgres",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  dagster-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_PASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:-kor_travel_map_dagster}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_USER: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:-}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:-}
      KOR_TRAVEL_MAP_MIGRATOR_PASSWORD: ${KOR_TRAVEL_MAP_MIGRATOR_PASSWORD:-}
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:-}
      KOR_TRAVEL_MAP_DAGSTER_PROFILE: ${KOR_TRAVEL_MAP_DAGSTER_PROFILE:-${KOR_TRAVEL_MAP_API_PROFILE:-production}}
      KOR_TRAVEL_MAP_POSTGRES_INIT_HOST: ${KOR_TRAVEL_MAP_POSTGRES_INIT_HOST:-postgres}
      PGPASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
    volumes:
      - kor-travel-map-dagster-storage-permit:/run/kor-travel-map-dagster-storage-permit
      - ./scripts/database-credential-preflight.sh:/usr/local/lib/kor-travel-map/database-credential-preflight.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ "$$KOR_TRAVEL_MAP_DAGSTER_PROFILE" != local-dev ]; then
          echo "dagster-db-init is local-dev only; production requires Docker Manager authority" >&2
          exit 1
        fi
        . /usr/local/lib/kor-travel-map/database-credential-preflight.sh
        validate_map_database_credentials KOR_TRAVEL_MAP_DAGSTER_PG_URL
        postgres_host="$$KOR_TRAVEL_MAP_POSTGRES_INIT_HOST"
        case "$$postgres_host" in ''|*[!A-Za-z0-9_.:-]*) echo "invalid PostgreSQL init host" >&2; exit 1 ;; esac
        for variable_name in KOR_TRAVEL_MAP_POSTGRES_DB KOR_TRAVEL_MAP_POSTGRES_USER KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB KOR_TRAVEL_MAP_DAGSTER_METADATA_USER; do
          eval "variable_value=\$$$${variable_name}"
          if ! echo "$$variable_value" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]{0,62}$$'; then
            echo "invalid database identity variable: $$variable_name" >&2
            exit 1
          fi
        done
        if [ "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" = "$$KOR_TRAVEL_MAP_POSTGRES_DB" ]; then
          echo "Dagster metadata DB must differ from the application DB" >&2
          exit 1
        fi
        if [ "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" = "$$KOR_TRAVEL_MAP_POSTGRES_USER" ]; then
          echo "Dagster metadata login must differ from the bootstrap login" >&2
          exit 1
        fi
        if [ "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" != "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" ]; then
          echo "Dagster metadata login and database must share one dedicated identity" >&2
          exit 1
        fi
        case "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" in
          postgres|pg_*|ktm_*) echo "reserved role cannot be used for Dagster metadata" >&2; exit 1 ;;
        esac
        case "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" in
          postgres|template0|template1) echo "reserved database cannot be used for Dagster metadata" >&2; exit 1 ;;
        esac
        [ -n "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD" ] || { echo "dedicated Dagster metadata password is required" >&2; exit 1; }
        metadata_password_length=$${#KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD}
        if [ "$$metadata_password_length" -lt 32 ] || [ "$$metadata_password_length" -gt 256 ]; then
          echo "Dagster metadata password must be 32..256 URI-unreserved characters" >&2
          exit 1
        fi
        case "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD" in *[!A-Za-z0-9._~-]*) echo "Dagster metadata password must be 32..256 URI-unreserved characters" >&2; exit 1 ;; esac
        if [ "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD" = "$$KOR_TRAVEL_MAP_POSTGRES_PASSWORD" ]; then
          echo "Dagster metadata password must differ from the bootstrap password" >&2
          exit 1
        fi
        [ -n "$$KOR_TRAVEL_MAP_DAGSTER_PG_URL" ] || { echo "dedicated Dagster metadata DSN is required" >&2; exit 1; }
        case "$$KOR_TRAVEL_MAP_DAGSTER_PG_URL" in *'?'*|*'#'*|*[![:graph:]]*) echo "Dagster metadata DSN must be a strict URI without query or fragment" >&2; exit 1 ;; esac
        dsn_prefix="postgresql://$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:$$KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD@"
        case "$$KOR_TRAVEL_MAP_DAGSTER_PG_URL" in "$$dsn_prefix"*) dsn_server="$${KOR_TRAVEL_MAP_DAGSTER_PG_URL#"$$dsn_prefix"}" ;; *) echo "Dagster metadata DSN credential does not match the declared metadata login" >&2; exit 1 ;; esac
        case "$$dsn_server" in */"$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB") dsn_authority="$${dsn_server%/"$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"}" ;; *) echo "Dagster metadata DSN database does not match the declared metadata DB" >&2; exit 1 ;; esac
        case "$$dsn_authority" in ''|*[!A-Za-z0-9_.:-]*) echo "Dagster metadata DSN authority is invalid" >&2; exit 1 ;; esac
        role_count="$$(psql -h "$$postgres_host" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -d "$$KOR_TRAVEL_MAP_POSTGRES_DB" -tAc "SELECT count(*) FROM pg_roles WHERE rolname = '$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER'")"
        database_count="$$(psql -h "$$postgres_host" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -d "$$KOR_TRAVEL_MAP_POSTGRES_DB" -tAc "SELECT count(*) FROM pg_database WHERE datname = '$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB'")"
        if { [ "$$role_count" = 0 ] && [ "$$database_count" = 0 ]; }; then
          existing_metadata=false
        elif { [ "$$role_count" = 1 ] && [ "$$database_count" = 1 ]; }; then
          existing_metadata=true
        else
          echo "Dagster metadata role/database partial state is not recoverable automatically" >&2
          exit 1
        fi
        permit_dir=/run/kor-travel-map-dagster-storage-permit
        permit_path="$$permit_dir/permit.json"
        if [ "$$existing_metadata" = true ]; then
          [ -d "$$permit_dir" ] && [ ! -L "$$permit_dir" ] \
            && [ "$$(stat -c '%u:%a' "$$permit_dir")" = 0:555 ] \
            && [ -f "$$permit_path" ] && [ ! -L "$$permit_path" ] \
            && [ "$$(stat -c '%u:%a:%h' "$$permit_path")" = 0:444:1 ] \
            || { echo "existing Dagster metadata resources require a sealed prior permit" >&2; exit 1; }
          permit_size="$$(wc -c <"$$permit_path")"
          case "$$permit_size" in ''|*[!0-9]*) echo "invalid prior Dagster metadata permit size" >&2; exit 1 ;; esac
          [ "$$permit_size" -le 1048576 ] || { echo "prior Dagster metadata permit is too large" >&2; exit 1; }
        else
          [ ! -e "$$permit_path" ] || { echo "stale Dagster metadata permit blocks first creation" >&2; exit 1; }
          psql -h "$$postgres_host" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -d "$$KOR_TRAVEL_MAP_POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -v metadata_user="$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" <<'SQL'
        \getenv metadata_password KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD
        SELECT format(
          'CREATE ROLE %I WITH LOGIN NOINHERIT PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS',
          :'metadata_user', :'metadata_password'
        )
        \gexec
        SQL
          createdb -h "$$postgres_host" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -O "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"
          echo "Dagster metadata DB created: $$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"
        fi
        dagster_identity="$$(psql "$$KOR_TRAVEL_MAP_DAGSTER_PG_URL" -At -F '|' -c "SELECT control.system_identifier::text, current_database(), database.oid::bigint, pg_get_userbyid(database.datdba), session_user, current_user, role.rolsuper, role.rolcanlogin, role.rolinherit, role.rolcreatedb, role.rolcreaterole, role.rolreplication, role.rolbypassrls, role.rolconnlimit, role.rolvaliduntil IS NULL, COALESCE(pg_catalog.cardinality(role.rolconfig), 0), (SELECT count(*)::bigint FROM pg_catalog.pg_db_role_setting AS setting WHERE setting.setrole = role.oid), (SELECT count(*)::bigint FROM pg_auth_members AS membership WHERE membership.member = role.oid), (SELECT count(*)::bigint FROM pg_auth_members AS membership WHERE membership.roleid = role.oid) FROM pg_database AS database JOIN pg_roles AS role ON role.rolname = session_user CROSS JOIN pg_control_system() AS control WHERE database.datname = current_database()")"
        application_identity="$$(psql -h "$$postgres_host" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -d "$$KOR_TRAVEL_MAP_POSTGRES_DB" -At -F '|' -c "SELECT control.system_identifier::text, current_database(), database.oid::bigint, pg_get_userbyid(database.datdba) FROM pg_database AS database CROSS JOIN pg_control_system() AS control WHERE database.datname = current_database()")"
        old_ifs="$$IFS"
        IFS='|' read -r dagster_system dagster_name dagster_oid dagster_owner dagster_login dagster_effective dagster_superuser dagster_canlogin dagster_inherit dagster_createdb dagster_createrole dagster_replication dagster_bypassrls dagster_connection_limit dagster_valid_until_is_null dagster_role_config_count dagster_database_role_setting_count dagster_granted_role_count dagster_member_role_count <<EOF
        $$dagster_identity
        EOF
        IFS='|' read -r application_system application_name application_oid application_owner <<EOF
        $$application_identity
        EOF
        IFS="$$old_ifs"
        if [ "$$dagster_name" != "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" ] \
          || [ "$$application_name" != "$$KOR_TRAVEL_MAP_POSTGRES_DB" ]; then
          echo "observed database names do not match the requested identities" >&2
          exit 1
        fi
        for numeric_value in "$$dagster_system" "$$dagster_oid" "$$application_system" "$$application_oid"; do
          case "$$numeric_value" in ''|*[!0-9]*) echo "invalid observed database numeric identity" >&2; exit 1 ;; esac
        done
        if [ "$$dagster_owner" != "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" ] \
          || [ "$$dagster_login" != "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" ] \
          || [ "$$dagster_effective" != "$$KOR_TRAVEL_MAP_DAGSTER_METADATA_USER" ] \
          || [ "$$dagster_superuser" != f ] \
          || [ "$$dagster_canlogin" != t ] \
          || [ "$$dagster_inherit" != f ] \
          || [ "$$dagster_createdb" != f ] \
          || [ "$$dagster_createrole" != f ] \
          || [ "$$dagster_replication" != f ] \
          || [ "$$dagster_bypassrls" != f ] \
          || [ "$$dagster_connection_limit" != -1 ] \
          || [ "$$dagster_valid_until_is_null" != t ] \
          || [ "$$dagster_role_config_count" != 0 ] \
          || [ "$$dagster_database_role_setting_count" != 0 ] \
          || [ "$$dagster_granted_role_count" != 0 ] \
          || [ "$$dagster_member_role_count" != 0 ]; then
          echo "Dagster metadata login is not a dedicated least-privilege owner" >&2
          exit 1
        fi
        for identity_name in "$$dagster_name" "$$dagster_owner" "$$dagster_login" "$$application_name" "$$application_owner"; do
          if ! echo "$$identity_name" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]{0,62}$$'; then
            echo "invalid observed database text identity" >&2
            exit 1
          fi
        done
        if [ "$$dagster_system" != "$$application_system" ] \
          || [ "$$dagster_owner" = "$$application_owner" ] \
          || { [ "$$dagster_name" = "$$application_name" ] && [ "$$dagster_oid" = "$$application_oid" ]; }; then
          echo "Dagster/application database identities are not isolated" >&2
          exit 1
        fi
        if [ "$$existing_metadata" = true ]; then
          operation_id="$$(sed -n 's/.*\"operation_id\":\"\([^\"]*\)\".*/\1/p' "$$permit_path")"
        else
          operation_id="$$(cat /proc/sys/kernel/random/uuid)"
        fi
        echo "$$operation_id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$$' \
          || { echo "Dagster metadata operation id is invalid" >&2; exit 1; }
        permit_json="{\"application_database\":{\"name\":\"$$application_name\",\"oid\":$$application_oid,\"owner\":\"$$application_owner\",\"system_identifier\":\"$$application_system\"},\"authority\":\"local-compose-db-init\",\"candidate\":null,\"dagster_database\":{\"login_role\":\"$$dagster_login\",\"login_role_attributes\":{\"bypass_rls\":false,\"can_login\":true,\"connection_limit\":-1,\"create_database\":false,\"create_role\":false,\"database_role_setting_count\":0,\"granted_role_count\":0,\"inherit\":false,\"member_role_count\":0,\"replication\":false,\"role_config_count\":0,\"superuser\":false,\"valid_until_is_null\":true},\"name\":\"$$dagster_name\",\"oid\":$$dagster_oid,\"owner\":\"$$dagster_owner\",\"system_identifier\":\"$$dagster_system\"},\"operation_id\":\"$$operation_id\",\"schema\":\"kor-travel-map.dagster-storage-database-permit.v2\"}"
        if [ "$$existing_metadata" = true ]; then
          [ "$$(cat "$$permit_path")" = "$$permit_json" ] \
            || { echo "existing Dagster metadata resources do not match the sealed prior permit" >&2; exit 1; }
          echo "Dagster metadata DB and sealed permit already exist: $$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"
          exit 0
        fi
        chmod 0700 "$$permit_dir"
        permit_tmp="$$(mktemp "$$permit_dir/.permit.XXXXXX")"
        printf '%s\n' "$$permit_json" >"$$permit_tmp"
        chmod 0444 "$$permit_tmp"
        mv "$$permit_tmp" "$$permit_dir/permit.json"
        chmod 0555 "$$permit_dir"

  # fresh profile의 application 역할 bootstrap과 같은 Compose env snapshot으로 metadata
  # DB/permit까지 먼저 만든다. 이를 normal up으로 미루면 두 one-shot 사이 credential
  # 변경이 dedicated metadata isolation을 우회할 수 있다.
  dagster-db-init-fresh-300:
    extends:
      service: dagster-db-init
    profiles: ["fresh-init"]
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PROFILE: local-dev
    depends_on:
      db-role-bootstrap-300:
        condition: service_completed_successfully

  # PostGIS image가 자동 확장한 maintenance DB를 application target으로 쓰지 않는다.
  # virgin application DB는 template0에서 한 번만 만들며, 존재하면 repair하지 않고
  # fresh volume으로 재시도하도록 mutation 전에 중단한다.
  db-application-create-fresh-300:
    image: postgres:16-alpine
    profiles: ["fresh-init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_POSTGRES_INIT_HOST: ${KOR_TRAVEL_MAP_POSTGRES_INIT_HOST:-postgres}
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE: ${KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE:-}
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_PASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:-}
      KOR_TRAVEL_MAP_MIGRATOR_PASSWORD: ${KOR_TRAVEL_MAP_MIGRATOR_PASSWORD:-}
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:-}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:-kor_travel_map_dagster}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_USER: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:-}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
      PGPASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
    volumes:
      - ./scripts/database-credential-preflight.sh:/usr/local/lib/kor-travel-map/database-credential-preflight.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ "$$KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE" != "$$KOR_TRAVEL_MAP_POSTGRES_DB" ]; then
          echo "fresh application database creation requires exact database confirmation" >&2
          exit 1
        fi
        . /usr/local/lib/kor-travel-map/database-credential-preflight.sh
        validate_map_database_credentials KOR_TRAVEL_MAP_DAGSTER_PG_URL
        case "$$KOR_TRAVEL_MAP_POSTGRES_INIT_HOST" in ''|*[!A-Za-z0-9_.:-]*) echo "invalid PostgreSQL init host" >&2; exit 1 ;; esac
        case "$$KOR_TRAVEL_MAP_POSTGRES_DB" in ''|postgres|template0|template1|*[!A-Za-z0-9_]*) echo "invalid fresh application database" >&2; exit 1 ;; esac
        case "$$KOR_TRAVEL_MAP_POSTGRES_USER" in ''|*[!A-Za-z0-9_]*) echo "invalid PostgreSQL bootstrap user" >&2; exit 1 ;; esac
        database_count="$$(psql -h "$$KOR_TRAVEL_MAP_POSTGRES_INIT_HOST" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -d postgres -Atqc "SELECT count(*) FROM pg_database WHERE datname = '$$KOR_TRAVEL_MAP_POSTGRES_DB'")"
        [ "$$database_count" = 0 ] || { echo "fresh application database already exists" >&2; exit 1; }
        createdb -h "$$KOR_TRAVEL_MAP_POSTGRES_INIT_HOST" -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" --maintenance-db postgres --template template0 --owner "$$KOR_TRAVEL_MAP_POSTGRES_USER" "$$KOR_TRAVEL_MAP_POSTGRES_DB"

  # T-VN-H46H — fresh DB에만 한 번 명시적으로 실행하는 bootstrap이다. normal
  # `compose up` dependency로 두면 persistent `300` DB의 service recreate 때도 다시
  # 실행되어 stack restart를 막으므로, `fresh-init` profile을 직접 target으로 실행한다.
  # 기존 `0236` DB의 handoff는 이 경로가 아니라 Docker Manager controlled transaction만
  # 수행한다.
  db-role-bootstrap-300:
    image: postgres:16-alpine
    profiles: ["fresh-init"]
    depends_on:
      db-application-create-fresh-300:
        condition: service_completed_successfully
    environment:
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_ENABLED: "true"
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_PHASE: baseline-300
      # `:?`는 profile-disabled external overlay도 interpolation 단계에서 막으므로
      # 여기서는 빈 값을 전달하고 script가 service 실행 시 fail-closed 한다.
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE: ${KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE:-}
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:-}
      KOR_TRAVEL_MAP_POSTGRES_INIT_HOST: ${KOR_TRAVEL_MAP_POSTGRES_INIT_HOST:-postgres}
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_PASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
      KOR_TRAVEL_MAP_MIGRATOR_PASSWORD: ${KOR_TRAVEL_MAP_MIGRATOR_PASSWORD:-}
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:-}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:-kor_travel_map_dagster}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_USER: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_USER:-}
      KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_METADATA_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
    volumes:
      - ./docker/postgres-role-bootstrap.sh:/usr/local/bin/postgres-role-bootstrap:ro
      - ./scripts/database-credential-preflight.sh:/usr/local/lib/kor-travel-map/database-credential-preflight.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-role-bootstrap"]

  # `fresh-init`은 production API entrypoint의 generic upgrade 우회가 아니다.
  # bootstrap-superuser와 분리된 candidate image one-shot이 exact root `300`과
  # runtime ACL을 적용한 뒤 종료한다. normal runtime은 이 service에 의존하지 않는다.
  db-application-schema-fresh-300:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
    profiles: ["fresh-init"]
    depends_on:
      dagster-db-init-fresh-300:
        condition: service_completed_successfully
    environment:
      # standalone compose fresh-init은 명시적인 비운영 개발 경로다. production은
      # Docker Manager가 literal production profile + root-owned fixed fence를 만든다.
      KOR_TRAVEL_MAP_APPLICATION_SCHEMA_PROFILE: local-dev
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:?KOR_TRAVEL_MAP_MIGRATOR_PG_DSN is required}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:?KOR_TRAVEL_MAP_MIGRATOR_PG_DSN is required}
    entrypoint:
      - /usr/local/bin/python
      - -I
      - /usr/local/bin/ktm-application-schema-fresh-300
      - migrate

  rustfs-perms:
    image: alpine:3.20
    user: root
    volumes:
      - kor-travel-map-rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      RUSTFS_SECRET_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    command: ["/data"]
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}:9000"
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_RUSTFS_CONSOLE_PORT:-12105}:9001"
    volumes:
      - kor-travel-map-rustfs-data:/data

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    environment:
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set rustfs http://rustfs:9000 "$$KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID" "$$KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing "rustfs/$$KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET"
        mc mb --ignore-existing "rustfs/$$KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
    env_file:
      # Provider credential이 있는 root .env를 API container에 통째로 넘기지 않는다.
      # API auth/route/backup 설정만 packages/kor-travel-map-api/.env에 둔다.
      - path: packages/kor-travel-map-api/.env
        required: true
        format: raw
    environment:
      KOR_TRAVEL_MAP_API_HOST: 0.0.0.0
      KOR_TRAVEL_MAP_API_PORT: ${KOR_TRAVEL_MAP_API_PORT:-12701}
      # ADR-066 T-VN-01 — Docker 배포는 기본 production profile로 기동하고, 필수
      # secret 누락 시 ApiSettings 검증이 기동을 거부한다(fail-closed). 로컬
      # full-stack 검증만 KOR_TRAVEL_MAP_API_PROFILE=local-dev를 명시한다.
      KOR_TRAVEL_MAP_API_PROFILE: ${KOR_TRAVEL_MAP_API_PROFILE:-production}
      # /debug 라우터는 production에서 route 자체를 내리도록 컨테이너 기본을 끄고,
      # public read(`/v1/curated-*` 포함)는 기본 keyed로 둔다. environment가
      # env_file(packages/kor-travel-map-api/.env)보다 우선하므로 package .env의
      # local 값이 production 컨테이너로 새지 않는다. 필요 시 host env로만 명시
      # override한다. ops 관측 read는 ops route flag와 기존 read/cancel principal
      # pair를 함께 사용하며 새 credential/env를 만들지 않는다(T-VN-03).
      KOR_TRAVEL_MAP_API_DEBUG_ROUTES_ENABLED: ${KOR_TRAVEL_MAP_API_DEBUG_ROUTES_ENABLED:-false}
      KOR_TRAVEL_MAP_API_PUBLIC_API_KEY_REQUIRED: ${KOR_TRAVEL_MAP_API_PUBLIC_API_KEY_REQUIRED:-true}
      # ADR-066 T-VN-H02R — standalone도 미설정 시 fail-closed(false)다. 파괴적
      # 조작이 필요한 standalone은 host env로 true를 명시하고, 승인된 production
      # Manager 형상은 canonical API service에 literal true를 별도로 주입한다.
      KOR_TRAVEL_MAP_API_DESTRUCTIVE_ENABLED: ${KOR_TRAVEL_MAP_API_DESTRUCTIVE_ENABLED:-false}
      KOR_TRAVEL_MAP_API_DAGSTER_URL: ${KOR_TRAVEL_MAP_DOCKER_API_DAGSTER_URL:-http://dagster:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
      KOR_TRAVEL_MAP_API_DAGSTER_ALLOWED_HOSTS: '${KOR_TRAVEL_MAP_DOCKER_API_DAGSTER_ALLOWED_HOSTS:-["dagster","127.0.0.1","localhost","::1"]}'
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET is required}
      # ADR-066 T-VN-01 — production은 features surface에서 service token을
      # 필수화한다(앞뒤 공백 없는 32자 이상, admin secret·ops token들과 달라야
      # 함 — entrypoint가 거부). admin secret과 같은 패턴으로 host env 누락 시
      # compose 평가가 즉시 실패한다.
      KOR_TRAVEL_MAP_API_SERVICE_TOKEN: ${KOR_TRAVEL_MAP_API_SERVICE_TOKEN:?KOR_TRAVEL_MAP_API_SERVICE_TOKEN is required}
      # T-VN-15 — 검색 cursor는 인증 credential과 분리한 server-only HMAC
      # secret으로 서명한다. API container에만 주입하며 host env 누락 시 compose
      # 평가가 즉시 실패한다.
      KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET: ${KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET:?KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET is required}
      # ADR-066 결정 4 (T-VN-02) — production은 /metrics를 scrape identity로
      # 제한한다. Prometheus scrape_config의 authorization(type Bearer)과 같은
      # 값을 주입해야 하며(앞뒤 공백 없는 32자 이상, 다른 secret과 달라야 함),
      # host env 누락 시 compose 평가가 즉시 실패한다.
      KOR_TRAVEL_MAP_API_METRICS_TOKEN: ${KOR_TRAVEL_MAP_API_METRICS_TOKEN:?KOR_TRAVEL_MAP_API_METRICS_TOKEN is required}
      # production ops surface를 켠 standalone/isolated run은 세 principal을 모두
      # 명시 주입한다. ``env_file``은 local developer 편의일 뿐 compose profile의
      # fail-closed startup 경계를 대신하지 않는다.
      KOR_TRAVEL_MAP_API_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED: ${KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED:-false}
      # T-VN-M01: API는 생성 전용 raw token을 절대 받지 않고 digest와 kill-switch만
      # 받는다. production은 flag=false인 사전 provision 단계에서도 digest를
      # hard-require하며 entrypoint가 migration 전에 settings 정본으로 재검증한다.
      KOR_TRAVEL_MAP_API_ADMIN_FEATURE_CREATE_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_ADMIN_FEATURE_CREATE_TOKEN_SHA256:?KOR_TRAVEL_MAP_API_ADMIN_FEATURE_CREATE_TOKEN_SHA256 is required}
      KOR_TRAVEL_MAP_API_ADMIN_MANUAL_FEATURE_CREATE_ENABLED: ${KOR_TRAVEL_MAP_API_ADMIN_MANUAL_FEATURE_CREATE_ENABLED:-false}
      # T-VN-40C: Map은 canonical curation principal의 digest만 안다. 원문 token은
      # PinVi API에만 전달하며 snapshot/mapping scope를 절대 공유하지 않는다.
      KOR_TRAVEL_MAP_API_PINVI_CURATION_SNAPSHOT_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_PINVI_CURATION_SNAPSHOT_TOKEN_SHA256:-}
      KOR_TRAVEL_MAP_API_PINVI_CURATION_CUTOVER_MAPPING_TOKEN_SHA256: ${KOR_TRAVEL_MAP_API_PINVI_CURATION_CUTOVER_MAPPING_TOKEN_SHA256:-}
      # bridge 모드의 BFF peer를 단일 고정 주소로 제한한다. 임의의 compose
      # container subnet 전체를 신뢰하지 않는다.
      KOR_TRAVEL_MAP_API_ADMIN_TRUSTED_PROXY_CIDRS: '["172.31.254.3/32"]'
      # production API consumer에는 migrator/bootstrap credential을 주입하지 않는다.
      # local developer convenience migration은 docker-compose.local-dev.yml만 소유한다.
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN is required}
      # production은 Manager가 immutable API image ID를 permit과 함께 주입한다.
      # local-dev에서는 verifier가 실행되지 않으므로 빈 값도 허용한다.
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_API_IMAGE_ID: ${KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_API_IMAGE_ID:-}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: "true"
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://rustfs:9000}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KOR_TRAVEL_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      KOR_TRAVEL_MAP_OBJECT_STORE_PUBLIC_BASE_URL: ${KOR_TRAVEL_MAP_OBJECT_STORE_PUBLIC_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}/${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX:-offline-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_MOIS_SOURCE_SYNC_TTL_HOURS: ${KOR_TRAVEL_MAP_MOIS_SOURCE_SYNC_TTL_HOURS:-24}
      KOR_TRAVEL_MAP_FILE_REGISTRY_E2E_BACKUP_TTL_DAYS: ${KOR_TRAVEL_MAP_FILE_REGISTRY_E2E_BACKUP_TTL_DAYS:-7}
      KOR_TRAVEL_MAP_FILE_REGISTRY_TEMP_TTL_DAYS: ${KOR_TRAVEL_MAP_FILE_REGISTRY_TEMP_TTL_DAYS:-14}
      # VWorld 키로 떨어지지 않는다 — 그건 kor-travel-geo가 **상류 VWorld로 나갈 때**
      # 쓰는 키이지 map이 geo에 인증할 소비자 키가 아니다. geo는 그 값을 401(E0401)로
      # 거절하는데, `preflight()`는 존재·길이만 보므로 리소스 초기화는 통과하고 첫
      # 요청에서야 터진다. 2026-08-13 prod에서 정확히 그렇게 dagster/daemon이 죽은 키를
      # 들고 있었다(T-VN-H46B). 비어 있으면 비어 있는 채로 두고 fail-closed 한다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:-}
      KOR_TRAVEL_MAP_KAKAO_LOCAL_REST_API_KEY: ${KOR_TRAVEL_MAP_KAKAO_LOCAL_REST_API_KEY:-${KAKAO_LOCAL_REST_API_KEY:-}}
      KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_ID: ${KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_ID:-${NAVER_SEARCH_CLIENT_ID:-}}
      KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_SECRET: ${KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_SECRET:-${NAVER_SEARCH_CLIENT_SECRET:-}}
      KOR_TRAVEL_MAP_GOOGLE_PLACES_API_KEY: ${KOR_TRAVEL_MAP_GOOGLE_PLACES_API_KEY:-${GOOGLE_PLACES_API_KEY:-}}
    # 호스트 공유 서비스(kor-travel-geo :12501, kor-travel-docker-manager RustFS :12101) 접근 경로.
    # Docker Desktop과 달리 docker-ce는 host.docker.internal을 기본 제공하지 않는다 (#372).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      # fixed read-only capability volume. 비어 있거나 stale한 permit은 production
      # verifier가 candidate/DB binding에서 거부한다.
      - kor-travel-map-application-final-permit:/run/kor-travel-map-application-final-permit:ro
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_API_PORT:-12701}:${KOR_TRAVEL_MAP_API_PORT:-12701}"
    networks:
      default:
      admin-control:
        ipv4_address: 172.31.254.2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('KOR_TRAVEL_MAP_API_PORT', '12701'), timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
        NEXT_PUBLIC_KOR_TRAVEL_MAP_API: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_API:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_PORT:-12701}}
        NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
        NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: ${NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL:-http://127.0.0.1:12501}
        NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-${KOR_TRAVEL_GEO_VWORLD_API_KEY:-${VWORLD_API_KEY:-}}}
    environment:
      NEXT_PUBLIC_KOR_TRAVEL_MAP_API: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_API:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_PORT:-12701}}
      NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
      NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: ${NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL:-http://127.0.0.1:12501}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-${KOR_TRAVEL_GEO_VWORLD_API_KEY:-${VWORLD_API_KEY:-}}}
      # geo consumer credential은 browser/build env에 싣지 않고 server runtime BFF에만
      # 별칭 결선한다. 프록시는 이 값만 X-KTG-API-Key header로 보낸다(T-VN-H46F).
      KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:-}
      KOR_TRAVEL_MAP_API_INTERNAL_URL: ${KOR_TRAVEL_MAP_DOCKER_API_INTERNAL_URL:-http://api:${KOR_TRAVEL_MAP_API_PORT:-12701}}
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET is required}
      # T-VN-M01: 생성 전용 raw token은 Next.js server runtime에만 둔다.
      # NEXT_PUBLIC/build arg가 아니므로 browser bundle과 image fingerprint에는 없다.
      KOR_TRAVEL_MAP_ADMIN_FEATURE_CREATE_TOKEN: ${KOR_TRAVEL_MAP_ADMIN_FEATURE_CREATE_TOKEN:?KOR_TRAVEL_MAP_ADMIN_FEATURE_CREATE_TOKEN is required}
      KOR_TRAVEL_MAP_UI_ADMIN_USERNAME: ${KOR_TRAVEL_MAP_UI_ADMIN_USERNAME:-admin}
      KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH: ${KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH:?KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH is required}
      KOR_TRAVEL_MAP_UI_SESSION_SECRET: ${KOR_TRAVEL_MAP_UI_SESSION_SECRET:?KOR_TRAVEL_MAP_UI_SESSION_SECRET is required}
      KOR_TRAVEL_MAP_UI_TRUST_PROXY_HEADERS: ${KOR_TRAVEL_MAP_UI_TRUST_PROXY_HEADERS:-false}
      KOR_TRAVEL_MAP_UI_PUBLIC_ORIGINS: ${KOR_TRAVEL_MAP_UI_PUBLIC_ORIGINS:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_ADMIN_WEB_PORT:-12705}:12705"
    networks:
      admin-control:
        ipv4_address: 172.31.254.3
    healthcheck:
      # bridge 모드 컨테이너는 내부적으로 PORT(미설정 시 Dockerfile 기본 12705)에 listen한다.
      # 런타임 process.env.PORT를 읽어 probe하면 PORT override(host overlay 포함)에도
      # 안전하다 (#507). process.env.PORT는 컨테이너 런타임에서 평가되므로 compose의
      # ${...} 변수치환과 무관하다.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||'12705')+'/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dagster:
    build:
      context: .
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
      secrets:
        - github_token
    command:
      - /usr/local/bin/dagster-webserver
      - -m
      - kortravelmap.dagster.definitions
      - -h
      - 0.0.0.0
      - -p
      - "${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}"
    environment:
      TMPDIR: /tmp
      TEMP: /tmp
      TMP: /tmp
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PROFILE: ${KOR_TRAVEL_MAP_DAGSTER_PROFILE:-${KOR_TRAVEL_MAP_API_PROFILE:-production}}
      KOR_TRAVEL_MAP_DAGSTER_PORT: ${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_IMAGE_ID: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PERMIT_IMAGE_ID:-}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_PAIRED_RECEIPT_SHA256:-}
      KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256: ${KOR_TRAVEL_MAP_DAGSTER_STORAGE_CONFIG_SHA256:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID: ${KOR_TRAVEL_MAP_APPLICATION_FINAL_PERMIT_DAGSTER_IMAGE_ID:-}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: "true"
      KOR_TRAVEL_MAP_DAGSTER_SCHEDULE_OVERRIDES_REQUIRED: "true"
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://rustfs:9000}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KOR_TRAVEL_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      KOR_TRAVEL_MAP_OBJECT_STORE_PREFIX: ${KOR_TRAVEL_MAP_OBJECT_STORE_PREFIX:-features}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX:-offline-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY:-${DATA_GO_KR_SERVICE_KEY:-${DATAGOKR_API_KEY:-${PUBLIC_DATA_SERVICE_KEY:-${SERVICE_KEY:-}}}}}
      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-${OPINET_API_KEY:-${OPINET_SERVICE_KEY:-}}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-disabled}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_KREX_EX_API_KEY: ${KOR_TRAVEL_MAP_KREX_EX_API_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}
      KOR_TRAVEL_MAP_KREX_GO_API_KEY: ${KOR_TRAVEL_MAP_KREX_GO_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}}
      # VWorld 키로 떨어지지 않는다 — 그건 kor-travel-geo가 **상류 VWorld로 나갈 때**
      # 쓰는 키이지 map이 geo에 인증할 소비자 키가 아니다. geo는 그 값을 401(E0401)로
      # 거절하는데, `preflight()`는 존재·길이만 보므로 리소스 초기화는 통과하고 첫
      # 요청에서야 터진다. 2026-08-13 prod에서 정확히 그렇게 dagster/daemon이 죽은 키를
      # 들고 있었다(T-VN-H46B). 비어 있으면 비어 있는 채로 두고 fail-closed 한다.
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_BASE_URL:-http://host.docker.internal:12501}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:-}
      KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH: ${KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH:-/app/data/mois/mois.db}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      # Map application schema readiness는 API가, Dagster metadata storage
      # readiness는 candidate image의 one-shot service가 각각 정본으로 보장한다.
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}"
    volumes:
      - kor-travel-map-mois-source:/app/data/mois
      - kor-travel-map-application-final-permit:/run/kor-travel-map-application-final-permit:ro
      - kor-travel-map-dagster-storage-permit:/run/kor-travel-map-dagster-storage-permit:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('KOR_TRAVEL_MAP_DAGSTER_PORT', '12702'), timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dagster-daemon:
    build:
      context: .
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
