services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    # T-102 — pg_prewarm autoprewarm background worker(부팅 후 buffer warm-up). 확장 자체는
    # alembic 0022가 만들고, autoprewarm(주기 dump + 재기동 reload)은 아래 server config로 켠다.
    # 저비용이라 standalone 스택 기본 on. 효과는 shared_buffers가 hot 데이터에 fit할 때 큼
    # (docs/performance.md §9.5). 끄려면 command override 제거.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_prewarm"
      - "-c"
      - "pg_prewarm.autoprewarm=on"
    environment:
      POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}
      POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      POSTGRES_PASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:-kor_travel_map_dagster}
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - kor-travel-map-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map} -d ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  dagster-db-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_PASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB: ${KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB:-kor_travel_map_dagster}
      PGPASSWORD: ${KOR_TRAVEL_MAP_POSTGRES_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ! echo "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$$'; then
          echo "invalid KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB=$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB" >&2
          exit 1
        fi
        if psql -h postgres -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" -d "$$KOR_TRAVEL_MAP_POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB'" | grep -q 1; then
          echo "Dagster metadata DB exists: $$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"
        else
          createdb -h postgres -U "$$KOR_TRAVEL_MAP_POSTGRES_USER" "$$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"
          echo "Dagster metadata DB created: $$KOR_TRAVEL_MAP_DAGSTER_POSTGRES_DB"
        fi

  # T-VN-34A / ADR-090 — local dedicated DB에서만 bootstrap owner가 LOGIN
  # migrator/runtime principal과 NOLOGIN schema owner를 provision하고 기존 object
  # ownership을 넘긴다. API/Dagster는 이 service 뒤에만 시작한다.
  db-role-bootstrap:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_ENABLED: "true"
      # `:?`는 profile-disabled external overlay도 interpolation 단계에서 막으므로
      # 여기서는 빈 값을 전달하고 script가 service 실행 시 fail-closed 한다.
      KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE: ${KOR_TRAVEL_MAP_DB_ROLE_BOOTSTRAP_CONFIRM_DATABASE:-}
      KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN: ${KOR_TRAVEL_MAP_BOOTSTRAP_PG_DSN:-}
      KOR_TRAVEL_MAP_POSTGRES_DB: ${KOR_TRAVEL_MAP_POSTGRES_DB:-kor_travel_map}
      KOR_TRAVEL_MAP_POSTGRES_USER: ${KOR_TRAVEL_MAP_POSTGRES_USER:-kor_travel_map}
      KOR_TRAVEL_MAP_MIGRATOR_PASSWORD: ${KOR_TRAVEL_MAP_MIGRATOR_PASSWORD:-}
      KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_API_RUNTIME_PASSWORD:-}
      KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PASSWORD:-}
    volumes:
      - ./docker/postgres-role-bootstrap.sh:/usr/local/bin/postgres-role-bootstrap:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-role-bootstrap"]

  rustfs-perms:
    image: alpine:3.20
    user: root
    volumes:
      - kor-travel-map-rustfs-data:/data
    command: ["sh", "-c", "chown -R 10001:10001 /data"]

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ADDRESS: :9000
      RUSTFS_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      RUSTFS_SECRET_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
    command: ["/data"]
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}:9000"
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_RUSTFS_CONSOLE_PORT:-12105}:9001"
    volumes:
      - kor-travel-map-rustfs-data:/data

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    environment:
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set rustfs http://rustfs:9000 "$$KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID" "$$KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY"; do
          sleep 2
        done
        mc mb --ignore-existing "rustfs/$$KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET"
        mc mb --ignore-existing "rustfs/$$KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
    env_file:
      # Provider credential이 있는 root .env를 API container에 통째로 넘기지 않는다.
      # API auth/route/backup 설정만 packages/kor-travel-map-api/.env에 둔다.
      - path: packages/kor-travel-map-api/.env
        required: true
        format: raw
    environment:
      KOR_TRAVEL_MAP_API_HOST: 0.0.0.0
      KOR_TRAVEL_MAP_API_PORT: ${KOR_TRAVEL_MAP_API_PORT:-12701}
      # ADR-066 T-VN-01 — Docker 배포는 기본 production profile로 기동하고, 필수
      # secret 누락 시 ApiSettings 검증이 기동을 거부한다(fail-closed). 로컬
      # full-stack 검증만 KOR_TRAVEL_MAP_API_PROFILE=local-dev를 명시한다.
      KOR_TRAVEL_MAP_API_PROFILE: ${KOR_TRAVEL_MAP_API_PROFILE:-production}
      # /debug 라우터는 production에서 route 자체를 내리도록 컨테이너 기본을 끄고,
      # public read(`/v1/curated-*` 포함)는 기본 keyed로 둔다. environment가
      # env_file(packages/kor-travel-map-api/.env)보다 우선하므로 package .env의
      # local 값이 production 컨테이너로 새지 않는다. 필요 시 host env로만 명시
      # override한다. ops 관측 read는 ops route flag와 기존 read/cancel principal
      # pair를 함께 사용하며 새 credential/env를 만들지 않는다(T-VN-03).
      KOR_TRAVEL_MAP_API_DEBUG_ROUTES_ENABLED: ${KOR_TRAVEL_MAP_API_DEBUG_ROUTES_ENABLED:-false}
      KOR_TRAVEL_MAP_API_PUBLIC_API_KEY_REQUIRED: ${KOR_TRAVEL_MAP_API_PUBLIC_API_KEY_REQUIRED:-true}
      # ADR-066 T-VN-H02R — standalone도 미설정 시 fail-closed(false)다. 파괴적
      # 조작이 필요한 standalone은 host env로 true를 명시하고, 승인된 production
      # Manager 형상은 canonical API service에 literal true를 별도로 주입한다.
      KOR_TRAVEL_MAP_API_DESTRUCTIVE_ENABLED: ${KOR_TRAVEL_MAP_API_DESTRUCTIVE_ENABLED:-false}
      KOR_TRAVEL_MAP_API_DAGSTER_URL: ${KOR_TRAVEL_MAP_DOCKER_API_DAGSTER_URL:-http://dagster:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
      KOR_TRAVEL_MAP_API_DAGSTER_ALLOWED_HOSTS: '${KOR_TRAVEL_MAP_DOCKER_API_DAGSTER_ALLOWED_HOSTS:-["dagster","127.0.0.1","localhost","::1"]}'
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET is required}
      # ADR-066 T-VN-01 — production은 features surface에서 service token을
      # 필수화한다(앞뒤 공백 없는 32자 이상, admin secret·ops token들과 달라야
      # 함 — entrypoint가 거부). admin secret과 같은 패턴으로 host env 누락 시
      # compose 평가가 즉시 실패한다.
      KOR_TRAVEL_MAP_API_SERVICE_TOKEN: ${KOR_TRAVEL_MAP_API_SERVICE_TOKEN:?KOR_TRAVEL_MAP_API_SERVICE_TOKEN is required}
      # T-VN-15 — 검색 cursor는 인증 credential과 분리한 server-only HMAC
      # secret으로 서명한다. API container에만 주입하며 host env 누락 시 compose
      # 평가가 즉시 실패한다.
      KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET: ${KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET:?KOR_TRAVEL_MAP_API_CURSOR_SIGNING_SECRET is required}
      # ADR-066 결정 4 (T-VN-02) — production은 /metrics를 scrape identity로
      # 제한한다. Prometheus scrape_config의 authorization(type Bearer)과 같은
      # 값을 주입해야 하며(앞뒤 공백 없는 32자 이상, 다른 secret과 달라야 함),
      # host env 누락 시 compose 평가가 즉시 실패한다.
      KOR_TRAVEL_MAP_API_METRICS_TOKEN: ${KOR_TRAVEL_MAP_API_METRICS_TOKEN:?KOR_TRAVEL_MAP_API_METRICS_TOKEN is required}
      # production ops surface를 켠 standalone/isolated run은 세 principal을 모두
      # 명시 주입한다. ``env_file``은 local developer 편의일 뿐 compose profile의
      # fail-closed startup 경계를 대신하지 않는다.
      KOR_TRAVEL_MAP_API_OPS_READ_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_READ_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_CANCEL_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN: ${KOR_TRAVEL_MAP_API_OPS_FIXTURE_TOKEN:-}
      KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED: ${KOR_TRAVEL_MAP_API_OPS_PRINCIPAL_REQUIRED:-false}
      # bridge 모드의 BFF peer를 단일 고정 주소로 제한한다. 임의의 compose
      # container subnet 전체를 신뢰하지 않는다.
      KOR_TRAVEL_MAP_API_ADMIN_TRUSTED_PROXY_CIDRS: '["172.31.254.3/32"]'
      # migration은 이 process가 시작될 때만 migrator DSN을 쓰고 exec 전 unset한다.
      # API application에는 API runtime DSN만 남는다 (fallback 금지).
      KOR_TRAVEL_MAP_MIGRATOR_PG_DSN: ${KOR_TRAVEL_MAP_MIGRATOR_PG_DSN:?KOR_TRAVEL_MAP_MIGRATOR_PG_DSN is required}
      KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_API_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: "true"
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://rustfs:9000}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KOR_TRAVEL_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      KOR_TRAVEL_MAP_OBJECT_STORE_PUBLIC_BASE_URL: ${KOR_TRAVEL_MAP_OBJECT_STORE_PUBLIC_BASE_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}/${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_PREFIX:-offline-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_MOIS_SOURCE_SYNC_TTL_HOURS: ${KOR_TRAVEL_MAP_MOIS_SOURCE_SYNC_TTL_HOURS:-24}
      KOR_TRAVEL_MAP_FILE_REGISTRY_E2E_BACKUP_TTL_DAYS: ${KOR_TRAVEL_MAP_FILE_REGISTRY_E2E_BACKUP_TTL_DAYS:-7}
      KOR_TRAVEL_MAP_FILE_REGISTRY_TEMP_TTL_DAYS: ${KOR_TRAVEL_MAP_FILE_REGISTRY_TEMP_TTL_DAYS:-14}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:-${NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY:-}}
      KOR_TRAVEL_MAP_KAKAO_LOCAL_REST_API_KEY: ${KOR_TRAVEL_MAP_KAKAO_LOCAL_REST_API_KEY:-${KAKAO_LOCAL_REST_API_KEY:-}}
      KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_ID: ${KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_ID:-${NAVER_SEARCH_CLIENT_ID:-}}
      KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_SECRET: ${KOR_TRAVEL_MAP_NAVER_SEARCH_CLIENT_SECRET:-${NAVER_SEARCH_CLIENT_SECRET:-}}
      KOR_TRAVEL_MAP_GOOGLE_PLACES_API_KEY: ${KOR_TRAVEL_MAP_GOOGLE_PLACES_API_KEY:-${GOOGLE_PLACES_API_KEY:-}}
    # 호스트 공유 서비스(kor-travel-geo :12501, kor-travel-docker-manager RustFS :12101) 접근 경로.
    # Docker Desktop과 달리 docker-ce는 host.docker.internal을 기본 제공하지 않는다 (#372).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_API_PORT:-12701}:${KOR_TRAVEL_MAP_API_PORT:-12701}"
    networks:
      default:
      admin-control:
        ipv4_address: 172.31.254.2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('KOR_TRAVEL_MAP_API_PORT', '12701'), timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
        NEXT_PUBLIC_KOR_TRAVEL_MAP_API: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_API:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_PORT:-12701}}
        NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
        NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: ${NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL:-http://127.0.0.1:12501}
        NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-${KOR_TRAVEL_GEO_VWORLD_API_KEY:-${VWORLD_API_KEY:-}}}
        NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY: ${NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY:-}
    environment:
      NEXT_PUBLIC_KOR_TRAVEL_MAP_API: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_API:-http://127.0.0.1:${KOR_TRAVEL_MAP_API_PORT:-12701}}
      NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: ${NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL:-http://127.0.0.1:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}}
      NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: ${NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL:-http://127.0.0.1:12501}
      NEXT_PUBLIC_VWORLD_API_KEY: ${NEXT_PUBLIC_VWORLD_API_KEY:-${KOR_TRAVEL_GEO_VWORLD_API_KEY:-${VWORLD_API_KEY:-}}}
      NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY: ${NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY:-}
      KOR_TRAVEL_MAP_API_INTERNAL_URL: ${KOR_TRAVEL_MAP_DOCKER_API_INTERNAL_URL:-http://api:${KOR_TRAVEL_MAP_API_PORT:-12701}}
      KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET: ${KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET:?KOR_TRAVEL_MAP_ADMIN_PROXY_SECRET is required}
      KOR_TRAVEL_MAP_UI_ADMIN_USERNAME: ${KOR_TRAVEL_MAP_UI_ADMIN_USERNAME:-admin}
      KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH: ${KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH:?KOR_TRAVEL_MAP_UI_ADMIN_PASSWORD_HASH is required}
      KOR_TRAVEL_MAP_UI_SESSION_SECRET: ${KOR_TRAVEL_MAP_UI_SESSION_SECRET:?KOR_TRAVEL_MAP_UI_SESSION_SECRET is required}
      KOR_TRAVEL_MAP_UI_TRUST_PROXY_HEADERS: ${KOR_TRAVEL_MAP_UI_TRUST_PROXY_HEADERS:-false}
      KOR_TRAVEL_MAP_UI_PUBLIC_ORIGINS: ${KOR_TRAVEL_MAP_UI_PUBLIC_ORIGINS:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_ADMIN_WEB_PORT:-12705}:12705"
    networks:
      admin-control:
        ipv4_address: 172.31.254.3
    healthcheck:
      # bridge 모드 컨테이너는 내부적으로 PORT(미설정 시 Dockerfile 기본 12705)에 listen한다.
      # 런타임 process.env.PORT를 읽어 probe하면 PORT override(host overlay 포함)에도
      # 안전하다 (#507). process.env.PORT는 컨테이너 런타임에서 평가되므로 compose의
      # ${...} 변수치환과 무관하다.
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.PORT||'12705')+'/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dagster:
    build:
      context: .
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
      secrets:
        - github_token
    command:
      - dagster-webserver
      - -m
      - kortravelmap.dagster.definitions
      - -h
      - 0.0.0.0
      - -p
      - "${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}"
    env_file:
      - path: .env
        required: false
        format: raw
    environment:
      TMPDIR: /tmp
      TEMP: /tmp
      TMP: /tmp
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PORT: ${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: "true"
      KOR_TRAVEL_MAP_DAGSTER_SCHEDULE_OVERRIDES_REQUIRED: "true"
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://rustfs:9000}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KOR_TRAVEL_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY:-${DATA_GO_KR_SERVICE_KEY:-${DATAGOKR_API_KEY:-${PUBLIC_DATA_SERVICE_KEY:-${SERVICE_KEY:-}}}}}
      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-${OPINET_API_KEY:-${OPINET_SERVICE_KEY:-}}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-disabled}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_KREX_EX_API_KEY: ${KOR_TRAVEL_MAP_KREX_EX_API_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}
      KOR_TRAVEL_MAP_KREX_GO_API_KEY: ${KOR_TRAVEL_MAP_KREX_GO_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:-${NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
      dagster-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      # Map application schema readiness는 API가, Dagster metadata storage
      # readiness는 candidate image의 one-shot service가 각각 정본으로 보장한다.
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "${KOR_TRAVEL_MAP_DOCKER_BIND_HOST:-127.0.0.1}:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}:${KOR_TRAVEL_MAP_DAGSTER_PORT:-12702}"
    volumes:
      - kor-travel-map-mois-source:/app/data/mois
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('KOR_TRAVEL_MAP_DAGSTER_PORT', '12702'), timeout=2).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dagster-daemon:
    build:
      context: .
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
      secrets:
        - github_token
    env_file:
      - path: .env
        required: false
        format: raw
    environment:
      TMPDIR: /tmp
      TEMP: /tmp
      TMP: /tmp
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
      KOR_TRAVEL_MAP_PG_DSN: ${KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN:?KOR_TRAVEL_MAP_DAGSTER_RUNTIME_PG_DSN is required}
      KOR_TRAVEL_MAP_RUNTIME_DB_PREFLIGHT_REQUIRED: "true"
      KOR_TRAVEL_MAP_DAGSTER_SCHEDULE_OVERRIDES_REQUIRED: "true"
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://rustfs:9000}
      KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET: ${KOR_TRAVEL_MAP_OBJECT_STORE_BUCKET:-kor-travel-map}
      KOR_TRAVEL_MAP_OBJECT_STORE_REGION: ${KOR_TRAVEL_MAP_OBJECT_STORE_REGION:-us-east-1}
      KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID: ${KOR_TRAVEL_MAP_OBJECT_STORE_ACCESS_KEY_ID:-kor-travel-map-dev-access}
      KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY: ${KOR_TRAVEL_MAP_OBJECT_STORE_SECRET_ACCESS_KEY:-kor-travel-map-dev-secret}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_BUCKET:-kor-travel-map-uploads}
      KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES: ${KOR_TRAVEL_MAP_OFFLINE_UPLOAD_MAX_BYTES:-104857600}
      KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY: ${KOR_TRAVEL_MAP_DATA_GO_KR_SERVICE_KEY:-${DATA_GO_KR_SERVICE_KEY:-${DATAGOKR_API_KEY:-${PUBLIC_DATA_SERVICE_KEY:-${SERVICE_KEY:-}}}}}
      KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH: ${KOR_TRAVEL_MAP_MOIS_SOURCE_DB_PATH:-/app/data/mois/mois.db}
      KOR_TRAVEL_MAP_OPINET_API_KEY: ${KOR_TRAVEL_MAP_OPINET_API_KEY:-${OPINET_API_KEY:-${OPINET_SERVICE_KEY:-}}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_MODE: ${KOR_TRAVEL_MAP_OPINET_SCOPE_MODE:-${OPINET_SCOPE_MODE:-disabled}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX: ${KOR_TRAVEL_MAP_OPINET_SCOPE_BBOX:-${OPINET_SCOPE_BBOX:-}}
      KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M: ${KOR_TRAVEL_MAP_OPINET_SCOPE_RADIUS_M:-${OPINET_SCOPE_RADIUS_M:-5000}}
      KOR_TRAVEL_MAP_KREX_EX_API_KEY: ${KOR_TRAVEL_MAP_KREX_EX_API_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}
      KOR_TRAVEL_MAP_KREX_GO_API_KEY: ${KOR_TRAVEL_MAP_KREX_GO_API_KEY:-${DATA_GO_KR_SERVICE_KEY:-${KEX_GO_API_KEY:-${KREX_API_KEY:-${KREX_SERVICE_KEY:-}}}}}
      KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY: ${KOR_TRAVEL_MAP_KOR_TRAVEL_GEO_API_KEY:-${NEXT_PUBLIC_KOR_TRAVEL_GEO_API_KEY:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-role-bootstrap:
        condition: service_completed_successfully
      dagster-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    volumes:
      - kor-travel-map-mois-source:/app/data/mois
    command: ["dagster-daemon", "run", "-m", "kortravelmap.dagster.definitions"]

  # 후보 image 안의 Dagster package migration graph를 그대로 실행·검증하는 유일한
  # metadata storage writer다. application Alembic과 source SHA는 전혀 읽지 않는다.
  dagster-storage-migrate:
    build:
      context: .
      dockerfile: docker/dagster.Dockerfile
      args:
        KOR_TRAVEL_MAP_GIT_COMMIT: ${KOR_TRAVEL_MAP_GIT_COMMIT:-development}
      secrets:
        - github_token
    command: ["ktm-dagster-storage", "migrate"]
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      DAGSTER_DISABLE_TELEMETRY: ${DAGSTER_DISABLE_TELEMETRY:-yes}
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_DOCKER_DAGSTER_PG_URL:-}
    # external DB/infra overlay가 host.docker.internal DSN을 주입하므로 one-shot도
    # 장기 Dagster service와 같은 host gateway mapping을 가져야 한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  kor-travel-map-postgres:
  kor-travel-map-mois-source:
    name: ${KOR_TRAVEL_MAP_MOIS_SOURCE_DB_VOLUME:-kor-travel-map-mois-source}
  kor-travel-map-rustfs-data:
    name: ${KOR_TRAVEL_MAP_RUSTFS_VOLUME:-kor-travel-map-rustfs}

# bridge 모드에서 API가 신뢰할 frontend BFF peer를 정확한 /32로 고정한다.
# 다른 서비스는 이 control-plane network에 참여하지 않는다.
networks:
  admin-control:
    ipam:
      config:
        - subnet: 172.31.254.0/29

# private provider repo fetch용 (#370). 미설정(빈 값) 시 public pin만 fetch.
secrets:
  github_token:
    environment: GITHUB_TOKEN
