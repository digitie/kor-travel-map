# 외부(공유) DB 모드 오버레이.
#
# PC 개발 환경의 host 5432는 kor-travel-docker-manager/kor-travel-geo가 소유한
# 공유 PostGIS 서버 인스턴스다. 이 모드는 kor-travel-map local Postgres만 띄우지 않고,
# RustFS는 kor-travel-map compose의 local 서비스를 계속 사용한다.
# 적용:
#
#   KOR_TRAVEL_MAP_DB_EXTERNAL=true bash scripts/docker-up.sh
#
# 공유 DB에는 `kor_travel_map`과 `kor_travel_map_dagster` DB가 있어야 한다.
# API/Dagster runtime·migrator·Dagster metadata DSN은 모두 ignored deployment env/vault로
# 명시한다. bootstrap password 또는 DSN의 tracked 기본값은 없다.
services:
  postgres:
    profiles: ["local-infra"]

  dagster-db-init:
    profiles: ["local-infra"]

  # 공유 DB에서는 ownership transfer bootstrap을 절대 자동 실행하지 않는다.
  # 역할은 dedicated map DB에 대해 운영자가 사전 provision해야 한다.
  db-role-bootstrap:
    profiles: ["local-infra"]

  api:
    depends_on: !override
      rustfs-init:
        condition: service_completed_successfully
    environment:

  dagster-storage-migrate:
    depends_on: !override {}
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL is required}

  dagster:
    depends_on: !override
      rustfs-init:
        condition: service_completed_successfully
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL is required}

  dagster-daemon:
    depends_on: !override
      rustfs-init:
        condition: service_completed_successfully
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:?KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL is required}
