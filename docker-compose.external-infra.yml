# 외부(공유) 인프라 모드 오버레이 (ADR-052 amendment).
#
# kor-travel-docker-manager가 소유한 map 전용 PostgreSQL(`kor-travel-map-postgres`,
# **:12700** — `5432`가 아니다, docker-manager ADR-37)과 RustFS(S3 :12101)를 쓸 때
# kor-travel-map compose의 local postgres/rustfs 계열을 시작하지 않는다. 이 overlay는
# Manager-owned production composition의 내부 입력이다. standalone `scripts/docker-up.sh`는
# permit producer가 없으므로 external DB/infra 모드를 명시적으로 거부한다.
#
# 공유 DB에는 `kor_travel_map`과 `kor_travel_map_dagster` DB가 있어야 한다.
# API/Dagster runtime·migrator·Dagster metadata DSN은 모두 ignored deployment env/vault로
# 명시한다. bootstrap password 또는 DSN의 tracked 기본값은 없다.
services:
  postgres:
    profiles: ["local-infra"]

  dagster-db-init:
    profiles: ["local-infra"]

  dagster-db-init-fresh-300:
    profiles: ["local-infra"]

  db-application-create-fresh-300:
    profiles: ["local-infra"]

  # 공유 DB에서는 ownership transfer bootstrap을 절대 자동 실행하지 않는다.
  # 역할은 dedicated map DB에 대해 운영자가 사전 provision해야 한다.
  db-role-bootstrap-300:
    profiles: ["local-infra"]

  rustfs-perms:
    profiles: ["local-infra"]

  rustfs:
    profiles: ["local-infra"]

  rustfs-init:
    profiles: ["local-infra"]

  api:
    depends_on: !override {}
    environment:
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://host.docker.internal:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}}

  dagster-storage-migrate:
    depends_on: !override {}
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:-}

  dagster:
    depends_on: !override
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:-}
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://host.docker.internal:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}}

  dagster-daemon:
    depends_on: !override
      dagster-storage-migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      KOR_TRAVEL_MAP_DAGSTER_PG_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_DAGSTER_PG_URL:-}
      KOR_TRAVEL_MAP_OBJECT_STORE_ENDPOINT_URL: ${KOR_TRAVEL_MAP_EXTERNAL_DOCKER_OBJECT_STORE_ENDPOINT_URL:-http://host.docker.internal:${KOR_TRAVEL_MAP_RUSTFS_API_PORT:-12101}}
