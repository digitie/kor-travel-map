name: frontend

# Next.js frontend(debug UI) 컴파일 게이트 — type-check + 프로덕션 build.
# PR#92(#117) 회고: `etl/page.tsx` JSDoc 주석 안의 `*/`가 블록 주석을 조기 종료해
# 빌드가 깨졌으나 frontend가 한 번도 컴파일된 적 없어 잠복했다. 본 게이트는
# 그런 잠복 syntax/타입 오류를 PR 머지 전에 차단한다.
#
# T-203 이후 모든 PR에서 check를 생성한다. required check의 legacy identity인
# `type-check + next build (Node 20)` 이름은 branch protection 전환 전까지 유지하지만,
# 실제 toolchain 계약과 실행은 Node 22.23.1이다.

on:
  push:
    branches: [main, integration/t-vn]
  pull_request:
    branches: [main, integration/t-vn]

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: type-check + next build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: npm ci (workspace 루트 — map-marker-react + frontend)
        # 루트 package.json의 npm workspaces 로 두 패키지 한 번에 설치.
        # admin frontend는 maplibre-gl + in-repo VWorld 스타일 빌더 사용 — 외부 git
        # dep 없음 (maplibre-vworld git dep는 #476에서 제거).
        run: npx --yes npm@12.0.1 ci --workspaces --include=optional --no-audit --no-fund

      # 게이트는 **배포되는 의존성**만 막는다(`--omit=dev`). dev 전용 도구의 취약점은
      # 사용자에게 나가지 않으므로 머지를 막지 않되, 아래 단계가 그대로 출력해
      # 눈에 보이게 둔다. 근거와 현재 미해결 건은 docs/dev-environment.md.
      - name: npm high 취약점 gate (배포 의존성)
        run: npx --yes npm@12.0.1 run audit:high

      - name: npm 취약점 리포트 (dev 포함, 비차단)
        run: npx --yes npm@12.0.1 run audit:dev

      - name: npm dependency tree integrity
        run: npx --yes npm@12.0.1 run verify:npm-tree

      - name: frontend ESLint effective config
        run: npx --yes npm@12.0.1 run verify:frontend-eslint

      - name: frontend ESLint full lint (0 warnings)
        run: npx --yes npm@12.0.1 -w packages/kor-travel-map-admin/frontend run lint

      - name: React Doctor 예외 전체 범위 검증
        run: npx --yes npm@12.0.1 run verify:react-doctor-config

      - name: React Doctor full scan (0 diagnostics)
        run: npx --yes npm@12.0.1 -w packages/kor-travel-map-admin/frontend run doctor

      - name: Next/Sharp optimizer ABI smoke
        run: npx --yes npm@12.0.1 run verify:next-sharp

      - name: admin frontend unit tests (vitest)
        # 이 저장소에는 vitest 스위트 36파일 285케이스가 있는데 **어떤 워크플로도
        # 돌리지 않았다**(적대 리뷰 8라운드 A5). 테스트가 저장소에 있는 것과
        # 게이트에 걸려 있는 것은 다른 문제다 — 안 도는 테스트는 없는 것과 같다.
        # Playwright e2e는 서비스 기동이 필요해 여기 넣지 않는다(n150에서 돈다).
        run: npx --yes npm@12.0.1 -w packages/kor-travel-map-admin/frontend run test

      - name: openapi-typescript drift check
        # T-RV-30: admin frontend가 사용하는 generated OpenAPI 타입 산출물이
        # packages/kor-travel-map-api/openapi.json과 drift 나지 않게 고정한다.
        run: npx --yes npm@12.0.1 -w packages/kor-travel-map-admin/frontend run gen:types:check

      - name: user-client types drift + surface assertions (T-210e)
        # downstream(TripMate) 소비용 user spec 타입 산출물 고정 + ADR-048 표면
        # 불변식(batch found / meta.page / 평면 lon,lat / /v1 경로) 컴파일 단언.
        run: |
          npx --yes npm@12.0.1 -w packages/kor-travel-map-user-client run gen:types:check
          npx --yes npm@12.0.1 -w packages/kor-travel-map-user-client run type-check

      - name: tsc --noEmit (frontend type-check)
        # 빠른 1차 게이트. JSDoc 주석 안의 `*/`(comment terminator) 같은 잠복
        # syntax 오류도 검출 (PR#92 회고).
        run: npx --yes npm@12.0.1 -w packages/kor-travel-map-admin/frontend run type-check

      - name: next build (production compile)
        # ADR-025 — swc/turbo의 syntax + 모듈 해석을 production 경로까지 확인.
        # NEXT_PUBLIC_* 는 build-time inline이므로 임의 값으로 진행 (실 호출 없음).
        env:
          NEXT_PUBLIC_KOR_TRAVEL_MAP_API: http://127.0.0.1:8087
          NEXT_PUBLIC_KOR_TRAVEL_MAP_DAGSTER_URL: http://127.0.0.1:12302
          NEXT_PUBLIC_KOR_TRAVEL_GEO_BASE_URL: http://127.0.0.1:12201
        run: npx --yes npm@12.0.1 -w packages/kor-travel-map-admin/frontend run build
