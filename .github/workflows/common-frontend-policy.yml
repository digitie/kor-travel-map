name: 공통 프론트엔드 정책
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common-policy:
    uses: digitie/kor-travel-common/.github/workflows/frontend-consumer-guard.yml@0dec9543c8c8730ce7b05837f2fbe6c31d4ede65
    with:
      common-ref: 0dec9543c8c8730ce7b05837f2fbe6c31d4ede65
      frontends: >-
        [{"package":"packages/kor-travel-map-admin/frontend/package.json","lock":"package-lock.json","workspace":"packages/kor-travel-map-admin/frontend","profile":"web"}]
      toolchain-manifests: >-
        ["package.json","packages/map-marker-react/package.json","packages/kor-travel-map-user-client/package.json"]
      node-dockerfiles: >-
        ["docker/frontend.Dockerfile"]
